<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban95</title>
  <link rel="stylesheet" href="/vendor/98.css">
  <link rel="stylesheet" href="/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="desktop"></main>
  <footer id="taskbar">
    <button id="start"><b>Start</b></button>
    <button id="tasks-left" class="task-scroll" aria-label="Scroll taskbar left" hidden>&#9664;</button>
    <div id="tasks"></div>
    <button id="tasks-right" class="task-scroll" aria-label="Scroll taskbar right" hidden>&#9654;</button>
    <div id="tray" class="status-bar-field">
      <button id="inbox-count" class="tray-button">Inbox 0</button>
      <button id="restart-badge" class="tray-button flag" title="Restart the board to use the merged changes" hidden>Restart</button>
      <button id="limits" class="tray-button">Limits</button>
      <span id="agents">0 agents</span>
      <span id="clock"></span>
    </div>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
