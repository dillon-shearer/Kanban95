<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban95 Setup</title>
  <link rel="stylesheet" href="/vendor/98.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <form id="setup" class="window k95-setup">
    <div class="title-bar"><div class="title-bar-text">Kanban95 Setup</div></div>
    <div class="window-body">
      <p id="intro">Where should the board keep its data, and which project should it open?</p>
      <div class="field-row-stacked">
        <label for="data">Data folder</label>
        <p class="k95-setup-note">Holds your settings, models, project list and global brain.<br>It can be on a carried drive that you share between machines.</p>
        <input id="data" type="text" required>
      </div>
      <div id="project-row" class="field-row-stacked">
        <label for="project">Project folder (any existing folder; a plain one becomes a git repo)</label>
        <input id="project" type="text" required>
      </div>
      <fieldset id="requirements" class="k95-setup-requirements">
        <legend>Requirements</legend>
      </fieldset>
      <p id="error" class="k95-setup-error" role="alert" hidden></p>
      <section class="field-row k95-setup-buttons">
        <button id="retry" type="button" hidden>Retry</button>
        <button id="next" type="submit" class="default">Next &gt;</button>
      </section>
    </div>
  </form>
  <script type="module" src="/setup.js"></script>
</body>
</html>
