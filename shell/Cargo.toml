[package]
name = "kanban95-shell"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
getrandom = "0.3"
serde_json = "1"
tauri-plugin-updater = "2"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The versions wry 0.57 uses, so nothing new is built: the page's fullscreen request goes to the window (main.rs).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "block2"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
