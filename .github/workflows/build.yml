name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:shell
      - run: npm run installer
      - uses: actions/upload-artifact@v5
        with:
          name: kanban95-windows
          path: shell/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    # Ticket #181 fixes the Mac build and removes this flag.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - run: npm ci
      - run: npm run build
      - run: npm run test:shell
      - if: ${{ !cancelled() }}
        run: npm run installer -- --target aarch64-apple-darwin --bundles app,dmg
      - if: ${{ !cancelled() }}
        run: npm run installer -- --target x86_64-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kanban95-macos
          path: shell/target/*/release/bundle/
          if-no-files-found: warn
