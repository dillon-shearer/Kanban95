name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run build
      - run: npm run test:shell
      - run: npm run installer ${{ inputs.release && '-- --config shell/tauri.updater.json' || '' }}
      - shell: bash
        run: 7z l shell/target/release/bundle/nsis/*-setup.exe | grep -iE '(^| |\\|/)node\.exe$'
      - uses: actions/upload-artifact@v5
        with:
          name: kanban95-windows
          path: |
            shell/target/release/bundle/nsis/*.exe
            shell/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - run: npm ci
      - run: npm run build
      - run: npm run test:shell
      - if: ${{ !cancelled() }}
        run: npm run installer -- --target aarch64-apple-darwin --bundles app,dmg ${{ inputs.release && '--config shell/tauri.updater.json' || '' }}
      - if: ${{ !cancelled() }}
        run: npm run installer -- --target x86_64-apple-darwin --bundles app,dmg ${{ inputs.release && '--config shell/tauri.updater.json' || '' }}
      - if: ${{ !cancelled() }}
        run: |
          for a in aarch64 x86_64; do
            n=shell/target/$a-apple-darwin/release/bundle/macos/Kanban95.app/Contents/MacOS/node
            test -x "$n" && file "$n" | grep -q "$(echo $a | sed s/aarch64/arm64/)" || exit 1
          done
      - if: ${{ !cancelled() }}
        working-directory: shell/target/aarch64-apple-darwin/release/bundle/macos/Kanban95.app/Contents/Resources/app
        run: ../../MacOS/node -e "const p = require('node-pty').spawn('/bin/echo', ['pty ok'], {}); p.onData((d) => process.stdout.write(d)); p.onExit((e) => process.exit(e.exitCode))"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kanban95-macos
          path: |
            shell/target/*/release/bundle/macos/*.app
            shell/target/*/release/bundle/macos/*.app.tar.gz
            shell/target/*/release/bundle/macos/*.app.tar.gz.sig
            shell/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
