name: release

on:
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v. Tag the commit as v$v, or set package.json to ${GITHUB_REF_NAME#v} and tag again."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - run: |
          mkdir out sig
          w="artifacts/kanban95-windows/Kanban95_${V}_x64-setup.exe"
          cp "$w" "out/Kanban95-$V-Windows-setup.exe"
          cp "$w.sig" "sig/Kanban95-$V-Windows-setup.exe.sig"
          for t in aarch64:aarch64:AppleSilicon x86_64:x64:Intel; do
            IFS=: read -r triple a name <<< "$t"
            b="artifacts/kanban95-macos/$triple-apple-darwin/release/bundle"
            cp "$b/dmg/Kanban95_${V}_$a.dmg" "out/Kanban95-$V-Mac-$name.dmg"
            cp "$b/macos/Kanban95.app.tar.gz" "out/updater-Kanban95-$V-Mac-$name.app.tar.gz"
            cp "$b/macos/Kanban95.app.tar.gz.sig" "sig/updater-Kanban95-$V-Mac-$name.app.tar.gz.sig"
          done
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          sed -e "s|{{version}}|$V|g" -e "s|{{base}}|$base|g" .github/release-notes.md > notes.md
          entry() { jq -n --arg url "$base/$1" --rawfile sig "sig/$1.sig" '{signature: ($sig | rtrimstr("\n")), url: $url}'; }
          jq -n --arg version "$V" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win "$(entry "Kanban95-$V-Windows-setup.exe")" \
            --argjson arm "$(entry "updater-Kanban95-$V-Mac-AppleSilicon.app.tar.gz")" \
            --argjson x64 "$(entry "updater-Kanban95-$V-Mac-Intel.app.tar.gz")" \
            '{version: $version, notes: "", pub_date: $pub_date, platforms: {"windows-x86_64": $win, "darwin-aarch64": $arm, "darwin-x86_64": $x64}}' > out/latest.json
          cat out/latest.json
          ls -l out
      - run: |
          pre=
          case "$V" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Kanban95 $V" --notes-file notes.md --generate-notes $pre
